name: "Create Scratch Org"

inputs:
  devHubOrgAuthUrl:
    description: "DevHub environment authorization URL"
    type: string
    required: true

  configFilePath:
    description: "Relative path to a scratch org configuration file"
    type: string
    default: "config/project-scratch-def.json"

  durationInDays:
    description: "Number of days for scratch org to expire after"
    required: true
    type: choice
    default: '5'
    options:
      - 1
      - 2
      - 3
      - 5
      - 7
      - 10
      - 15
      - 20
      - 30

outputs:
  scratchOrgUrl:
    description: "Login URL of the created scratch org"
    value: ${{ steps.createScratchOrg.outputs.scratchOrgUrl }}

  scratchOrgUsername:
    description: "Username of the created scratch org"
    value: ${{ steps.createScratchOrg.outputs.scratchOrgUsername }}

  scratchOrgPassword:
    description: "Password of the created scratch org"
    value: ${{ steps.createScratchOrg.outputs.scratchOrgPassword }}

runs:
  using: "composite"

  steps:
    - name: "Authorize DevHub Org"
      id: authorizeDevHubOrg
      continue-on-error: false
      uses: ./.github/actions/authorizeOrg
      with:
        targetOrgAlias: "devHub"
        targetOrgAuthUrl: ${{ inputs.devHubOrgAuthUrl }}
      
    - name: "Create Scratch Org"
      id: createScratchOrg
      shell: bash
      continue-on-error: false
      env:
          SCRATCH_ORG_CONFIG_FILE_PATH: ${{ inputs.configFilePath }}
          SCRATCH_ORG_ALIAS: "scratchOrg"
          DEVHUB_ORG_ALIAS: ${{ steps.authorizeDevHubOrg.outputs.targetOrgAlias }}
      run: |
        echo "⏳ Creating a scratch org..."
        echo "Target scratch org configuration file: ${SCRATCH_ORG_CONFIG_FILE_PATH}"
        cat $SCRATCH_ORG_CONFIG_FILE_PATH

        # setting scratch org alias at runner's level for other steps. Declaring top-level 'env' attribute does not work for composite actions. 
        echo "SCRATCH_ORG_ALIAS=$SCRATCH_ORG_ALIAS" >> $GITHUB_ENV

        SCRATCH_ORG_CREATION_RESPONSE=$(sf org create scratch \
            -f "$SCRATCH_ORG_CONFIG_FILE_PATH" \
            -y ${{ inputs.durationInDays }} \
            -v "$DEVHUB_ORG_ALIAS" \
            -w 60 \
            -a "$SCRATCH_ORG_ALIAS" \
            --json)

        SCRATCH_ORG_CREATION_STATUS_CODE=$(echo "$SCRATCH_ORG_CREATION_RESPONSE" | jq .status);

        # early exit - error when creating scratch org
        if [[ "$SCRATCH_ORG_CREATION_STATUS_CODE" != "0" ]]; then

          echo "❌ Problem when creating the scratch org"
          exit 1

        fi

        echo ""
        echo "✅ Successfully created the scratch org"


        echo "⏳ Generating credentials to the scratch org..."

        # extracting scratch org username
        SCRATCH_ORG_USERNAME=$(echo $SCRATCH_ORG_CREATION_RESPONSE | jq -r ".result.username")

        # extracting scratch org URL
        SCRATCH_ORG_URL=$(echo $SCRATCH_ORG_CREATION_RESPONSE | jq -r ".result.scratchOrgInfo.LoginUrl // empty")
        SCRATCH_ORG_URL=${SCRATCH_ORG_URL:-"https://test.salesforce.com"}

        GENERATED_USER_PASSWORD_RESPONSE=$(sf org generate password \
            -o="$SCRATCH_ORG_ALIAS" \
            --complexity=3 \
            --json)

        GENERATED_USER_PASSWORD_STATUS_CODE=$(echo "$GENERATED_USER_PASSWORD_RESPONSE" | jq .status);

        if [[ $GENERATED_USER_PASSWORD_STATUS_CODE -eq 0 ]]; then

          SCRATCH_ORG_PASSWORD=$(echo -e "$GENERATED_USER_PASSWORD_RESPONSE" | jq -r '.result | if type=="array" then .[0].password else .password end');
        
        fi

        echo "✅ Successfully generated scratch org credentials"

        echo "URL: $SCRATCH_ORG_URL"
        echo "Username: $SCRATCH_ORG_USERNAME"
        echo "Password: $SCRATCH_ORG_PASSWORD"

        # set credentials in outputs
        echo "scratchOrgUrl=$SCRATCH_ORG_URL" >> $GITHUB_OUTPUT
        echo "scratchOrgUsername=$SCRATCH_ORG_USERNAME" >> $GITHUB_OUTPUT
        echo "scratchOrgPassword=$SCRATCH_ORG_PASSWORD" >> $GITHUB_OUTPUT

        # print credentials in job summary
        echo "🔑 Scratch Org Credentials 🔑" >> $GITHUB_STEP_SUMMARY
        echo "URL: $SCRATCH_ORG_URL" >> $GITHUB_STEP_SUMMARY
        echo "Username: $SCRATCH_ORG_USERNAME" >> $GITHUB_STEP_SUMMARY
        echo "Password: $SCRATCH_ORG_PASSWORD" >> $GITHUB_STEP_SUMMARY

    - name: "Set Profiles Login IP Ranges"
      shell: bash
      env:
        POST_STEP_PATH: "modules/common/scratch/01-meta-openAccess/profiles"
      run: |
        echo "⏳ Deploying profiles changes related to login IP ranges..."

        sf project deploy start \
            -d "$POST_STEP_PATH" \
            -o "$SCRATCH_ORG_ALIAS" \
            --ignore-conflicts \
            --ignore-warnings \
            -w 1000

        echo "✅ Profile changes are successfully deployed"