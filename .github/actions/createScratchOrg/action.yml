name: "Create Scratch Org"

inputs:
    devHubOrgSfdxUrl:
        description: "DevHub environment SFDX URL"
        type: string
        required: true

    configFilePath:
        description: "Relative path to a scratch org configuration file"
        type: string
        default: "config/project-scratch-def.json"

    durationInDays:
        description: "Number of days for scratch org to expire after"
        required: true
        type: choice
        default: '5'
        options:
            - 1
            - 2
            - 3
            - 5
            - 7
            - 10
            - 15
            - 20
            - 30

runs:
    using: "composite"

    steps:
        - shell: bash
          env:
              DEVHUB_ORG_SFDX_URL: ${{ inputs.devHubOrgSfdxUrl }}
              DEVHUB_ORG_ALIAS: "devHub"
              SCRATCH_ORG_CONFIG_FILE_PATH: ${{ inputs.configFilePath }}
              SCRATCH_ORG_ALIAS: "scratchOrg"
          run: |
            echo "Duration days: ${{ inputs.durationInDays }}"
            echo "⏳ Authorizing to the DevHub environment..."

            DX_AUTH_RESPONSE=$(echo $DEVHUB_ORG_SFDX_URL | sf org login sfdx-url --sfdx-url-stdin --json -a "$DEVHUB_ORG_ALIAS");
            DX_STATUS_CODE=$(echo $DX_AUTH_RESPONSE | jq .status);

            # early exit - error when authorizing to DevHub
            if [[ "$DX_STATUS_CODE" != "0" ]]; then
              echo "❌ Cannot log in to DevHub"
              exit 1
            fi

            echo "✅ Successfully authorized to the DevHub environment"


            echo "⏳ Creating a scratch org..."
            echo "Target scratch org configuration file: ${SCRATCH_ORG_CONFIG_FILE_PATH}"
            cat $SCRATCH_ORG_CONFIG_FILE_PATH

            #$(sf org create scratch -f "$SCRATCH_ORG_CONFIG_FILE_PATH" -v "$DEVHUB_ORG_ALIAS" -w 60 -a "$SCRATCH_ORG_ALIAS" --json);
