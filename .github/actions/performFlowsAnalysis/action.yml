name: "Perform Flows Analysis"

inputs:
  pathToScan:
    description: "Path to a directory with flows to scan"
    type: string
    default: "force-app"

  failWhenViolations:
    description: "Fail if violations threshold is exceeded"
    type: boolean
    default: true

  violationsThreshold:
    description: "Violations threshold"
    type: number
    default: 15

runs:
  using: "composite"

  steps:
    - name: "Install Plugin - Lightning Flow Scanner"
      continue-on-error: false
      shell: bash
      env:
        PLUGIN_VERSION: "latest"
      run: |
        echo "⏳ Installing 'lightning-flow-scanner' plugin if no originally installed version is available..."

        (sf plugins | grep -i "lightning-flow-scanner") || (echo "y" | sf plugins install lightning-flow-scanner@$PLUGIN_VERSION)

        echo "✅ 'lightning-flow-scanner' plugin is installed successfully"

    - name: "Run Lightning Flow Scanner"
      id: runFlowsAnalyzer
      shell: bash
      continue-on-error: true
      env:
        PATH_TO_SCAN: ${{ inputs.pathToScan }}
      run: |
        echo "⏳ Running 'lightning-flow-scanner' against '$PATH_TO_SCAN' path"

        sf flow scan --directory="$PATH_TO_SCAN"

        echo "✅ Execution of 'lightning-flow-scanner' is successfully completed"

    - name: "Check Analysis Results"
      shell: bash
      run: |
        echo "Some analysis results..."