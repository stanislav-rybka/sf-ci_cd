name: "Create Scratch Org"

inputs:
  targetOrgUrl:
    description: "Target environment login URL"
    type: string
    default: "https://test.salesforce.com"

  targetOrgUsername: 
    description: "Target environment username"
    type: string
    required: true

  targetOrgPassword:
    description: "Target environment password"
    type: string
    required: true

  deploymentMode:
    description: "Deployment mode"
    required: true
    type: choice
    default: "install"
    options:
      - install
      - upgrade
      - validateOnly
      - validateWithTests

runs:
  using: "composite"

  steps:
    - shell: bash
      continue-on-error: false
      env:
          TARGET_ORG_URL: ${{ inputs.targetOrgUrl }}
          TARGET_ORG_USERNAME: ${{ inputs.targetOrgUsername }}
          TARGET_ORG_PASSWORD: ${{ inputs.targetOrgPassword }}
          TARGET_ORG_ALIAS: "targetOrg"
          SOURCE_DIRECTORY: "force-app"
      run: |
        echo "Target Org URL: $TARGET_ORG_URL"
        echo "Target Org Username: $TARGET_ORG_USERNAME"
        echo "Target Org Password: $TARGET_ORG_PASSWORD"

        if [[ -z "$TARGET_ORG_USERNAME" || "$TARGET_ORG_USERNAME" == "none" || \
              -z "$TARGET_ORG_PASSWORD" || "$TARGET_ORG_PASSWORD" == "none" || \
              -z "$TARGET_ORG_URL" || "$TARGET_ORG_URL" == "none" ]]; then

          echo "❌ Target environment credentials are not completely provided. Cannot continue the deployment process."
          exit 1;

        fi


        echo "⏳ Authorizing to the target environment..."

        # temporary disabling immediate exit by using "set +e/-e" commands (i.e. some kind of try/catch)
        set +e
        DX_AUTH_RESPONSE=$(sf sfpowerkit:auth:login -u "$TARGET_ORG_USERNAME" -p "$TARGET_ORG_PASSWORD" -r "$TARGET_ORG_URL" -a "$TARGET_ORG_ALIAS" --json);
        DX_STATUS_CODE=$(echo "$DX_AUTH_RESPONSE" | jq .status);
        set -e

        # early exit - error when authorizing to target org by creds
        if [[ "$DX_STATUS_CODE" != "0" ]]; then

          echo "❌ Error when logging in to the target org by provided credentials as '$TARGET_ORG_USERNAME' user."
          echo "$DX_AUTH_RESPONSE" | jq .message
          exit 1;

        fi

        echo ""
        echo "✅ Successfully authorized as '$TARGET_ORG_USERNAME' user"


        # TODO: profiles reconciliation


        echo "⏳ Deploying metadata..."

        if [[ "${DEPLOYMENT_ACTION_TYPE}" == "validateOnly" ]] ; then

          echo "⏳ Running deployment with in the "Validate Only / Without Tests " mode..."

          sf project deploy start -o "$TARGET_ORG_ALIAS" -d "$SOURCE_DIRECTORY" --dry-run --ignore-conflicts --ignore-warnings --test-level="NoTestRun" -w 1000 --concise

          echo "✅ Successfully deployed in the 'Validate Only / Without Tests' mode"

        fi