name: "Initialization"

inputs:
  useCache:
    description: Use cache?
    type: boolean
    default: true

runs:
  using: "composite"
    
  steps:
    - if: ${{ inputs.useCache == 'true' }}
      name: "Configure npm cache"
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('**/package.json') }}
        restore-keys: |
          npm-${{ runner.os }}

    - name: "Print node / npm versions"
      shell: bash
      run: |
        NODE_VERSION=$(node --version);
        NPM_VERSION=$(npm --version);

        echo "🏷️ Node version: $NODE_VERSION"
        echo "🏷️ npm version: $NPM_VERSION"

    - name: "Install sfdx with npm"
      shell: bash
      run: npm install @salesforce/cli --global

    - name: "Install sfdx plugins"
      shell: bash
      run: |
        # echo "⏳ Installing sfdmu plugin if no originally installed version is available ..."
        # (sf plugins | grep -i "sfdmu") || (echo "y" | sf plugins install sfdmu@$(sfdmuVersion))

        echo "⏳ Installing sfpowerkit plugin if no originally installed version is available ..."
        (sf plugins | grep -i "sfpowerkit") || (echo "y" | sf plugins install sfpowerkit@$latest)

        # for some reasons, 'rimraf' module is not automatically installed for the 'sfpowerkit' plugin.
        # As a workaround here - installing the module manually
        cd /home/runner/.local/share/sf/node_modules/sfpowerkit
        npm install rimraf
        cd $GITHUB_WORKSPACE

        echo "⏳ Checking sf plugins..."
        sf plugins --core