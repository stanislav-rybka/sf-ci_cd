name: Initialization

inputs:
    useCache:
        description: Use cache?
        type: boolean
        default: true

runs:
    using: "composite"
    
    steps:
        - name: "Print node / npm versions"
          shell: bash
          run: |
            echo "Checking node version..."
            node --version

            echo "Checking npm version..."
            npm --version

        - name: "Install sfdx with npm"
          shell: bash
          run: npm install @salesforce/cli --global --loglevel verbose