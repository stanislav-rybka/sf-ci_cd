name: "Validate Pull Request"
run-name: "Validate Pull Request (${{ github.actor }})"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      failWhenAnalysingCode:
        description: "Fail when running code analysis?"
        type: boolean
        default: true

      failWhenAnalysingFlows:
        description: "Fail when running flows analysis?"
        type: boolean
        default: true

jobs:
  PerformMetadataAnalysis:
    runs-on: ubuntu-latest
    
    name: "Perform Metadata Analysis"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
      
      - name: "Initialize"
        uses: ./.github/actions/init

      - name: "Perform Code Analysis"
        uses: ./.github/actions/performCodeAnalysis
        with:
          failWhenViolations: ${{ github.event_name == 'workflow_dispatch' && !inputs.failWhenAnalysingCode && 'false' || 'true' }}

      - name: "Perform Flows Analysis"
        uses: ./.github/actions/performFlowsAnalysis
        with:
          failWhenViolations: ${{ github.event_name == 'workflow_dispatch' && !inputs.failWhenAnalysingFlows && 'false' || 'false' }}

  ValidateMetadataDeployment:
    needs: PerformMetadataAnalysis

    runs-on: ubuntu-latest

    name: "Validate Metadata Deployment"

    env:
      deploymentMode: "validateWithTests"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Initialize"
        uses: ./.github/actions/init

      - name: "Validate Deployment"
        uses: ./.github/actions/deployMetadata
        with:
          targetOrgAuthUrl: ${{ secrets.STAGING_ORG_AUTH_URL }}
          deploymentMode: ${{ env.deploymentMode }}