name: "Validate Pull Request"
run-name: "Validate Pull Request (${{ github.actor }})"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      failWhenAnalysingCode:
        description: "Fail when running code analysis?"
        type: boolean
        default: true

jobs:
  PerformCodeAnalysis:
    runs-on: ubuntu-latest
    
    name: "Perform Code Analysis"

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
      
      - name: "Initialize"
        uses: ./.github/actions/init

      - name: "Perform Code Analysis"
        uses: ./.github/actions/performCodeAnalysis
        with:
          testString: ${{ github.event_name == 'workflow_dispatch' && inputs.testString || 'Alternative value' }}
          failWhenViolations: ${{ github.event_name == 'workflow_dispatch' && !inputs.failWhenAnalysingCode && 'false' || 'true' }}