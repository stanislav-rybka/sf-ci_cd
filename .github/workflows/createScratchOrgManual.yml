name: "Create Scratch Org Manual"
run-name: "Create Scratch Org Manual (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      durationInDays:
        description: "Number of days for scratch org to expire after"
        required: true
        type: choice
        default: '5'
        options:
          - 1
          - 2
          - 3
          - 5
          - 7
          - 10
          - 15
          - 20
          - 30

jobs:
  CreateScratchOrg:
    runs-on: ubuntu-latest
    
    name: "Create Scratch Org"
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4
      
      - name: "Initialize"
        uses: ./.github/actions/init
      
      - name: "Create Scratch Org"
        uses: ./.github/actions/createScratchOrg
        with:
          devHubOrgAuthUrl: ${{ secrets.DEVHUB_ORG_AUTH_URL }}
          durationInDays: ${{ inputs.durationInDays }}