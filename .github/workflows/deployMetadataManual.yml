name: "Deploy Metadata Manual"
run-name: "Deploy Metadata Manual (${{ github.actor }})"

on:
  workflow_dispatch:
    inputs:
      targetOrgAuthFileName:
        description: "Target environment authorization file name"
        type: string
        default: "none"

      shouldCreateScratchOrg:
        description: "Create new scratch org?"
        type: boolean
        default: false

      scratchOrgDurationInDays:
        description: "Number of days for scratch org to expire after"
        required: true
        type: choice
        default: '5'
        options:
          - 1
          - 2
          - 3
          - 5
          - 7
          - 10
          - 15
          - 20
          - 30

      deploymentMode:
        description: "Deployment mode"
        required: true
        type: choice
        default: "install"
        options:
          - install
          - upgrade
          - validateOnly
          - validateWithTests

jobs:
  DeployMetadata:
    runs-on: ubuntu-latest
      
    name: "Deploy Metadata"

    env:
      TARGET_ORG_AUTH_FILE_NAME: ${{ inputs.targetOrgAuthFileName }}
      TARGET_ORG_AUTH_URL: ""

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Initialize"
        uses: ./.github/actions/init

      - if: ${{ inputs.shouldCreateScratchOrg == true }}
        name: "Create Scratch Org"
        id: createScratchOrg
        uses: ./.github/actions/createScratchOrg
        with:
          devHubOrgAuthUrl: ${{ secrets.DEVHUB_ORG_AUTH_URL }}
          durationInDays: ${{ inputs.scratchOrgDurationInDays }}

      - name: "Assign Target Org Credentials"
        run: |
          if [[ "${{ inputs.shouldCreateScratchOrg }}" =~ ^[Tt]rue$ ]] ; then

            echo "TARGET_ORG_AUTH_URL=${{ steps.createScratchOrg.outputs.scratchOrgAuthUrl }}" >> $GITHUB_ENV

          else

            TARGET_ORG_AUTH_URL="${{ secrets[env.TARGET_ORG_AUTH_FILE_NAME] }}"

            if [ -z "$TARGET_ORG_AUTH_URL" ]; then

              echo "❌ Target org authorization file not found: $TARGET_ORG_AUTH_FILE_NAME"
              exit 1

            fi

            echo "TARGET_ORG_AUTH_URL=$TARGET_ORG_AUTH_URL" >> $GITHUB_ENV

          fi

      - name: "Deploy Metadata"
        uses: ./.github/actions/deployMetadata
        with:
          targetOrgAuthUrl: ${{ env.TARGET_ORG_AUTH_URL }}
          deploymentMode: ${{ inputs.deploymentMode }}